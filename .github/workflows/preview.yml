# Plan morning-digest § 3 and § 4 (ADR 0003). Saves /digest/2026-10-28 as one HTML file and
# deploys it to GitHub Pages. The preview is never committed. The banner shows the
# LANE_MARKER repo secret; with the secret deleted, it reads "no marker set" (§ 4 clean-up).
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/digest-2026-10-28.html
          if grep -q 'no marker set' _site/digest-2026-10-28.html; then echo "banner: no marker set"; else echo "banner: marker set"; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v5
